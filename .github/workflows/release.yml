name: Release SDK

on:
  push:
    branches: [main]
    paths:
      - "gradle.properties"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omnilink-release
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "::error::Automated releases may only run from main."
            exit 1
          }
          bash scripts/security_sanity.sh
          bash scripts/verify_docs_version.sh
          ./gradlew build test publishToMavenLocal --stacktrace

      - name: Resolve SDK version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^OMNILINK_VERSION=//p' gradle.properties | head -n1 | tr -d '[:space:]')"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid OMNILINK_VERSION: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            HEAD_COMMIT="$(git rev-parse HEAD)"
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "::error::Tag $TAG already points to $TAG_COMMIT, not release HEAD $HEAD_COMMIT"
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version tag
        if: steps.exists.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "OmniLinkSDK $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        if: steps.exists.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "OmniLinkSDK $TAG" \
            --generate-notes

      - name: Release summary
        run: |
          {
            echo "## OmniLinkSDK ${{ steps.version.outputs.tag }}"
            echo ""
            echo "Release existed before run: ${{ steps.exists.outputs.exists }}"
            echo "JitPack aggregate: `com.github.obieda-hussien:OmniLinkSDK:${{ steps.version.outputs.tag }}`"
            echo "Android module: `com.github.obieda-hussien.OmniLinkSDK:omni-link-sdk:${{ steps.version.outputs.tag }}`"
            echo "JVM transport: `com.github.obieda-hussien.OmniLinkSDK:omni-link-transport:${{ steps.version.outputs.tag }}`"
          } >> "$GITHUB_STEP_SUMMARY"
