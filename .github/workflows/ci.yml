name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
      - 'feature/**'
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Security sanity checks
        run: bash scripts/security_sanity.sh

      - name: Verify documentation version
        run: bash scripts/verify_docs_version.sh

      - name: Build Android + JVM transport and run tests
        run: ./gradlew build test --stacktrace

      - name: Verify local Maven publications
        run: ./gradlew publishToMavenLocal --stacktrace

  publish_verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Verify all publications
        run: ./gradlew publishToMavenLocal --stacktrace
