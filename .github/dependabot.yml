version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Africa/Cairo"
    target-branch: "main"
    open-pull-requests-limit: 5
    reviewers:
      - "obieda-hussien"
    commit-message:
      prefix: "deps"
    # AGP 9 and Gradle 9 require a coordinated build-system migration.
    # Do not let Dependabot upgrade either independently.
    ignore:
      - dependency-name: "com.android.library"
        versions:
          - ">= 9.0.0"
      - dependency-name: "gradle-wrapper"
        versions:
          - ">= 9.0.0"
    groups:
      kotlin-runtime:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      test-tooling:
        dependency-type: "development"
        patterns:
          - "junit:*"
          - "org.robolectric:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Africa/Cairo"
    target-branch: "main"
    open-pull-requests-limit: 5
    reviewers:
      - "obieda-hussien"
    commit-message:
      prefix: "ci"
